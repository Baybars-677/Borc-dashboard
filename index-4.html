<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111e">
  <title>2026 Finans Paneli</title>
  <style>
    :root{
      --bg:#07111e;
      --panel:#101d30;
      --panel2:#14243a;
      --line:#29405f;
      --text:#f8fafc;
      --muted:#9cafc8;
      --blue:#38bdf8;
      --green:#34d399;
      --orange:#fb923c;
      --red:#f87171;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family:Arial,Helvetica,sans-serif;
      background:linear-gradient(145deg,#07111e,#111f35);
      color:var(--text);
      padding:24px;
    }
    .wrap{max-width:680px;margin:0 auto}
    .head{padding:22px 4px 12px}
    h1{font-size:30px;margin:0 0 8px}
    .sub{color:var(--muted);line-height:1.5}
    .grid{display:grid;gap:14px;margin-top:18px}
    button.card{
      width:100%;
      display:block;
      text-align:left;
      border:1px solid var(--line);
      border-radius:18px;
      padding:20px;
      color:var(--text);
      background:linear-gradient(145deg,var(--panel),var(--panel2));
      box-shadow:0 12px 30px rgba(0,0,0,.28);
      cursor:pointer;
      font:inherit;
    }
    button.card:active{transform:scale(.99)}
    button.card:disabled{opacity:.65;cursor:wait}
    .row{display:flex;align-items:center;gap:14px}
    .icon{
      width:52px;height:52px;border-radius:15px;
      display:grid;place-items:center;
      flex:0 0 auto;font-size:26px;font-weight:800;
    }
    .blue{background:rgba(56,189,248,.14);color:var(--blue)}
    .green{background:rgba(52,211,153,.14);color:var(--green)}
    .orange{background:rgba(251,146,60,.14);color:var(--orange)}
    .title{font-size:19px;font-weight:800}
    .desc{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.4}
    #status{
      min-height:22px;
      margin:18px 4px 0;
      color:var(--muted);
      font-size:13px;
      text-align:center;
    }
    #status.error{color:var(--red)}
    .foot{margin-top:14px;color:var(--muted);font-size:12px;text-align:center}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="head">
      <h1>2026 Finans Paneli</h1>
      <div class="sub">Borç, gelir ve borç azaltma dosyalarına tek ekrandan erişin.</div>
    </div>

    <section class="grid">
      <button class="card" onclick="openFirst(this,'borc')">
        <div class="row">
          <div class="icon blue">₺</div>
          <div>
            <div class="title">Borç Dashboard</div>
            <div class="desc">KMH, kredi kartları, krediler ve aylık giderler.</div>
          </div>
        </div>
      </button>

      <button class="card" onclick="openFirst(this,'gelir')">
        <div class="row">
          <div class="icon green">↗</div>
          <div>
            <div class="title">Gelir Dashboard</div>
            <div class="desc">Aylık gelirler, ortalamalar ve yıl sonu tahmini.</div>
          </div>
        </div>
      </button>

      <button class="card" onclick="openFirst(this,'azaltma')">
        <div class="row">
          <div class="icon orange">✓</div>
          <div>
            <div class="title">Borç Azaltma Planı</div>
            <div class="desc">Aylık yol haritası, ödeme sırası ve kapanış takvimi.</div>
          </div>
        </div>
      </button>
    </section>

    <div id="status"></div>
    <div class="foot">GitHub Pages ana sayfası</div>
  </main>

<script>
const FILES = {
  borc: [
    "borc-dashboard.html",
    "2026_Borc_Dashboard_Profesyonel-3.html"
  ],
  gelir: [
    "2026_Gelir_Dashboard-2.html"
  ],
  azaltma: [
    "azaltma.html"
  ]
};

async function exists(file){
  try{
    const response = await fetch(file + "?kontrol=" + Date.now(), {
      method: "GET",
      cache: "no-store"
    });
    if(!response.ok) return false;
    const text = await response.text();
    return text.trim().length > 20 && !text.includes("404 · File not found");
  }catch(e){
    return false;
  }
}

async function openFirst(button, group){
  const status = document.getElementById("status");
  status.className = "";
  status.textContent = "Dosya kontrol ediliyor…";
  button.disabled = true;

  for(const file of FILES[group]){
    if(await exists(file)){
      status.textContent = "Açılıyor…";
      location.href = file;
      return;
    }
  }

  button.disabled = false;
  status.className = "error";
  status.textContent = "Bu bölüme ait HTML dosyası GitHub klasöründe bulunamadı.";
}
</script>
</body>
</html>
